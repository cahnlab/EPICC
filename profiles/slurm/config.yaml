# profiles/slurm/config.yaml
#
# EXAMPLE SLURM profile. Copy this file and edit for your cluster, to either
#   ~/.config/snakemake/<name>/config.yaml      (then: --profile <name>)
# or any path of your choosing
#   (then: --profile path/to/config.yaml   or   export SNAKEMAKE_PROFILE=...)
# and edit every value flagged "EDIT:" below.

executor: slurm
jobs: 16
use-conda: true
conda-frontend: conda
conda-cleanup-pkgs: tarballs
latency-wait: 60
keep-going: true
max-jobs-per-second: 2
max-status-checks-per-second: 5
# Auto-retry transient cluster glitches: SLURM control-plane hiccups
# ("Unable to confirm allocation", "Batch job submission failed") and
# SnowParam PSOCK port collisions in the DMR pair-context rule (random
# ephemeral-port reuse under high concurrent load; ~1-2 % of jobs on
# whole-genome plant runs). Real bugs still surface after the retry.
retries: 1
# Node failures and preemption are SLURM's to requeue; `retries` covers
# everything else. This flag submits jobs with `sbatch --requeue` and tells
# the plugin to keep tracking a NODE_FAIL'd job under its original ID
# instead of reporting it failed. Without it, on a cluster with
# JobRequeue=1 the plugin retries a job SLURM has already requeued, and the
# two copies run at once in the same output directory (Bismark's temp
# splits get clobbered and bowtie2 aborts on mismatched mates). Don't
# switch to `slurm-no-requeue`: a preempted job is then cancelled, and the
# plugin waits on it indefinitely. See dev/docs/upstream_blockers.md for
# the one node-failure bug this does not avoid.
slurm-requeue: true

# Safety-net defaults sent with every sbatch submission.
#
# SITE-SPECIFIC — review before using on a new cluster:
#   * slurm_account    Change to your cluster's SLURM account. Silences
#                      the "No SLURM account given" warning. Remove this
#                      line if your cluster doesn't require --account.
#   * runtime          Fallback wall time in minutes, used only if a rule
#                      fails to declare its own runtime resource. Raise
#                      if your shortest rule takes longer than 60 min.
default-resources:
  - runtime="1h"
  #- slurm_account="<your-slurm-account>"   # EDIT: uncomment and replace with your cluster's SLURM account if --account is required.

# precommand runs in every job's shell on the compute node, before the rule
# body. It is OFF by default -- most sites need no precommand at all.
#
# TMPDIR is already handled by the workflow: workflow/Snakefile installs a
# shell.prefix pointing TMPDIR at {output_dir}/.tmp/<job>.<pid> for every rule.
# That runs *after* precommand and wins, so setting TMPDIR here does nothing
# unless you also set use_node_tmpdir: true in the options file (or pass
# --use-node-tmpdir). Only then is precommand the place to wire local scratch:
#
#   precommand: 'test -n "\$SLURM_JOB_ID" && export TMPDIR=/path/to/scratch/\$USER/\$SLURM_JOB_ID && mkdir -p \$TMPDIR || true'
#
# Beware sites with JobContainerType=job_container/tmpfs, where /tmp is a
# RAM-backed tmpfs sized off the job's mem allocation rather than by TmpDisk --
# routing TMPDIR to /tmp there trades an NFS bottleneck for ENOSPC. Detect with
# `scontrol show config | grep JobContainerType` on a login node.
#
# SLURM_CONF: two separate upstream bugs strip it, and both end the same way --
# every job dies with
#   srun: fatal: Could not establish a configuration source
# on clusters where SLURM_CONF is the only route to slurm.conf (no
# /etc/slurm/slurm.conf on the compute nodes; the path comes from a module).
#
#   1. snakemake-executor-plugin-slurm deletes every SLURM_* variable when
#      snakemake itself runs inside an allocation. Prefer launching from a
#      login/dev node. If you must submit from within a job, restore the path
#      here -- precommand runs downstream of that wipe:
#
#        precommand: 'export SLURM_CONF=/path/to/slurm.conf'
#
#   2. snakemake-executor-plugin-slurm-jobstep 0.6.1 strips it from the inner
#      srun's environment on *every* run, wherever it was launched. precommand
#      does NOT help -- the strip happens inside the job. Pin the plugin to
#      <0.6.1 (config/epicc-env.txt does this).
#
# See dev/docs/upstream_blockers.md.

# Per-rule cluster-specific overrides go here if any rule needs different
# resources/threads on this cluster than profiles/default/config.yaml
# specifies. Uncomment and adapt as needed.
#
# slurm_extra:
#   Forwarded verbatim to sbatch by snakemake-executor-plugin-slurm.
#   Useful for flags the plugin doesn't manage itself — most importantly
#   --tmp=N for rules that write large intermediates into TMPDIR.
#   Without an explicit --tmp request, sbatch lands the job on whatever
#   node and the local /tmp partition can fill up under concurrent load
#   (e.g. deeptools bamCompare with --binSize 1 on a plant genome runs
#   into ENOSPC). Skip these lines if your cluster doesn't configure
#   TmpDisk= in slurm.conf — the flag is silently ignored in that case.
#   Sizes are in MB; tune to your nodes' actual scratch capacity.
