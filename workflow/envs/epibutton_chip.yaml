name: epibutton_chip
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - bowtie2
  - chromap>=0.2.7  # <0.2.7 crashes when piping to /dev/stdout (haowenz/chromap#150)
  - samtools
  - bedtools
  - deeptools<5  # capped, not floored: macs2's newest build is py311 and deeptools 4 needs python >=3.12, so this env cannot have 4.x while macs2 is in it. Only alignmentSieve, bamCoverage, bamCompare and plotFingerprint run here, none of which changed across the 3->4 boundary -- computeMatrix and the plotting rules live in epibutton.yaml, which does floor at 4.
  - macs2
  - seacr
  - epic2
  - setuptools<71  # epic2 still imports pkg_resources via the legacy setuptools API; setuptools 71+ unbundled it into a separate PyPI distribution that conda-forge does not yet ship, so pin to the last release that vendors pkg_resources directly.
  - pigz
  - manorm